[build]
  publish = "dist"
  command = "npm run build"

# SPA fallback so deep links like /?qrTable=... always load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/updates/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
