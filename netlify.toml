[build]
  publish = "dist"
  command = "npm run build"

# Single-page app: serve index.html for client-side routes (e.g. /?qrTable=...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/updates/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
    X-Content-Type-Options = "nosniff"
